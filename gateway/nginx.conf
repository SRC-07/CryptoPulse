# ========================================================
# CryptoPulse API Gateway & Load Balancer (Nginx 1.27)
# Balanceo de Carga de Capa 7 (least_conn) + Rate Limiting
# ========================================================

# Zona de Rate Limiting para mitigación de ataques DoS (15 req/s por IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

# Clúster Balanceado para Market Service (E1)
upstream market_service_cluster {
    least_conn;
    server market-service-1:8000 max_fails=3 fail_timeout=10s;
    server market-service-2:8000 max_fails=3 fail_timeout=10s;
}

# Clúster Balanceado para Portfolio & Auth Service (E2)
upstream portfolio_service_cluster {
    least_conn;
    server portfolio-service-1:8001 max_fails=3 fail_timeout=10s;
    server portfolio-service-2:8001 max_fails=3 fail_timeout=10s;
}

# Worker de Notificaciones Asíncronas (E3)
upstream notification_worker {
    server notification-worker:8002;
}

server {
    listen 80;
    server_name localhost;

    # DNS Resolver interno de Docker (evita fallos de arranque en cascada)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeceras de diagnóstico de balanceo
    add_header X-Load-Balancer "nginx-least_conn-v2" always;
    add_header X-Served-By $upstream_addr always;

    # Cabeceras estrictas de seguridad HTTP (ISO 9126 - Seguridad)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Soporte WebSocket para transmisión de precios en tiempo real (Eficiencia)
    location /ws/ {
        proxy_pass http://market_service_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Encaminamiento y balanceo hacia Portfolio & Auth Service (E2)
    location ~ ^/api/(auth|wallet|portfolio)/ {
        limit_req zone=api_limit burst=25 nodelay;

        proxy_pass http://portfolio_service_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Configuración CORS y Cabeceras de Seguridad (ISO 9126)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Load-Balancer "nginx-least_conn-v2" always;
        add_header X-Served-By $upstream_addr always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Encaminamiento hacia Notification Worker (E3)
    location /api/notifications/ {
        limit_req zone=api_limit burst=25 nodelay;

        proxy_pass http://notification_worker;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Load-Balancer "nginx-least_conn-v2" always;
        add_header X-Served-By $upstream_addr always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Encaminamiento y balanceo por defecto hacia Market Service (E1)
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://market_service_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Load-Balancer "nginx-least_conn-v2" always;
        add_header X-Served-By $upstream_addr always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Health Check propio del Load Balancer
    location /gateway/health {
        access_log off;
        return 200 '{"status": "healthy", "service": "api-gateway", "type": "nginx-load-balancer", "algorithm": "least_conn", "rate_limiting": "enabled"}';
        add_header Content-Type application/json;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
