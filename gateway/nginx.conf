upstream market_service {
    server market-service:8000;
}

server {
    listen 80;
    server_name localhost;

    # ============================================
    # API Gateway - Reverse Proxy Configuration
    # ============================================
    
    # Proxy todas las peticiones /api/ hacia el Market Service en la red interna
    location /api/ {
        proxy_pass http://market_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para APIs externas que pueden tardar
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # CORS Headers para permitir peticiones desde React
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Manejar preflight requests (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Health check del propio Gateway
    location /gateway/health {
        access_log off;
        return 200 '{"status": "healthy", "service": "api-gateway", "type": "nginx"}';
        add_header Content-Type application/json;
    }

    # Logs de acceso y errores
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
