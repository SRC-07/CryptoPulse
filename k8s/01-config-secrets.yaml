apiVersion: v1
kind: ConfigMap
metadata:
  name: cryptopulse-config
  namespace: cryptopulse
data:
  APP_ENV: "production"
  PORT: "8000"
  MONGO_HOST: "mongodb-service"
  MONGO_PORT: "27017"
  MONGO_DB: "cryptopulse_market"
  REDIS_URL: "redis://redis-service:6379/0"
  DATABASE_URL: "postgresql+asyncpg://cryptopulse:cryptopulse_secret_2024@postgres-service:5432/cryptopulse_portfolio"
  INITIAL_SIMULATED_BALANCE: "10000.0"
  MARKET_SERVICE_URL: "http://market-service:8000"
  COINGECKO_BASE_URL: "https://api.coingecko.com/api/v3"
  FRANKFURTER_BASE_URL: "https://api.frankfurter.app"
---
apiVersion: v1
kind: Secret
metadata:
  name: cryptopulse-secrets
  namespace: cryptopulse
type: Opaque
stringData:
  POSTGRES_USER: "cryptopulse"
  POSTGRES_PASSWORD: "cryptopulse_secret_2024"
  POSTGRES_DB: "cryptopulse_portfolio"
  MONGO_INITDB_ROOT_USERNAME: "cryptopulse"
  MONGO_INITDB_ROOT_PASSWORD: "cryptopulse_secret_2024"
  JWT_SECRET_KEY: "cryptopulse_ultra_secure_jwt_key_iso9126_production_2026"
