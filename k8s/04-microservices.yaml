# ==========================================
# Clúster Market Service (E1) — 2 Réplicas
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
  namespace: cryptopulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-service
  template:
    metadata:
      labels:
        app: market-service
    spec:
      containers:
        - name: market-service
          image: cryptopulse/market-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cryptopulse-config
            - secretRef:
                name: cryptopulse-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: market-service
  namespace: cryptopulse
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: market-service
---
