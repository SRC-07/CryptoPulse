# ==========================================
# Notification Worker (E3)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: cryptopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: cryptopulse/notification-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: cryptopulse-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-worker
  namespace: cryptopulse
spec:
  ports:
    - port: 8002
      targetPort: 8002
  selector:
    app: notification-worker
