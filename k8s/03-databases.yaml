# ==========================================
# Db1: PostgreSQL 16 (Relacional - E2)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cryptopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: cryptopulse-secrets
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: cryptopulse
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
# ==========================================
# Db2: MongoDB 7 (Documental - E1)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: cryptopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          envFrom:
            - secretRef:
                name: cryptopulse-secrets
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: cryptopulse
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb
---
# ==========================================
# Db3: Redis 7 (In-Memory - E3)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cryptopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: cryptopulse
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
