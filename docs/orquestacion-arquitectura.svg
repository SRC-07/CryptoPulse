<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra suave para tarjetas -->
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Marcador de flecha hacia abajo/derecha -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>

    <!-- Marcador de flecha hacia arriba -->
    <marker id="arrow-up" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Fondo General (Mismo tono azulado claro que la referencia) -->
  <rect width="1000" height="640" fill="#f1f5f9"/>

  <!-- ========================================== -->
  <!-- 1. ICONO DE LAPTOP (CLIENTE / INVERSOR)     -->
  <!-- ========================================== -->
  <g transform="translate(440, 25)">
    <!-- Pantalla marco exterior -->
    <rect x="18" y="10" width="84" height="54" rx="4" fill="#334155"/>
    <!-- Pantalla interior blanca -->
    <rect x="23" y="15" width="74" height="44" rx="2" fill="#ffffff"/>
    <!-- Detalle gráfico simulado en pantalla -->
    <path d="M 30 45 L 45 32 L 60 38 L 75 25 L 90 30" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bisagra / Base superior -->
    <path d="M 8 64 L 112 64 L 118 72 L 2 72 Z" fill="#1e293b"/>
    <!-- Ranura táctil -->
    <rect x="50" y="66" width="20" height="2.5" rx="1" fill="#64748b"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. FLECHAS VERTICALES: LAPTOP <-> ORCHESTRATOR -->
  <!-- ========================================== -->
  <!-- Flecha 1: Petición hacia abajo -->
  <line x1="465" y1="105" x2="465" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">
    1: POST /simulate/order
  </text>

  <!-- Flecha 7: Respuesta hacia arriba -->
  <line x1="535" y1="185" x2="535" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#arrow-up)"/>
  <text x="545" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">
    7: 200 OK (Wallet &amp; Orders)
  </text>

  <!-- ========================================== -->
  <!-- 3. CAJA CENTRAL: ORDER ORCHESTRATOR        -->
  <!-- ========================================== -->
  <g transform="translate(420, 190)">
    <rect x="0" y="0" width="160" height="74" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#card-shadow)"/>
    <text x="80" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
      CryptoPulse
    </text>
    <text x="80" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">
      Order Orchestrator
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 4. LÍNEAS DE ORQUESTACIÓN EN ABANICO       -->
  <!-- ========================================== -->

  <!-- Rama 2: Hacia Market Service (Extrema Izquierda) -->
  <path d="M 420 227 L 115 227 L 115 470" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
    2: Fetch Market Price
  </text>

  <!-- Rama 3: Hacia Wallet & ACID Balance Service -->
  <path d="M 440 264 L 440 330 L 305 330 L 305 470" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">
    3: Lock &amp; Debit Balance
  </text>

  <!-- Rama 4: Hacia Portfolio Asset Service (Centro) -->
  <line x1="500" y1="264" x2="500" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">
    4: Update Crypto Asset
  </text>

  <!-- Rama 5: Hacia Ledger Order Service -->
  <path d="M 560 264 L 560 330 L 695 330 L 695 470" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">
    5: Record Audit Order
  </text>

  <!-- Rama 6: Hacia Notification Service (Extrema Derecha) -->
  <path d="M 580 227 L 885 227 L 885 470" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
    6: Send Notifications
  </text>

  <!-- ========================================== -->
  <!-- 5. CINCO CAJAS INFERIORES DE MICROSERVICIOS -->
  <!-- ========================================== -->

  <!-- Caja 1: Market Service (E1) -->
  <g transform="translate(40, 480)">
    <rect x="0" y="0" width="150" height="85" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#card-shadow)"/>
    <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Market
    </text>
    <text x="75" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Service (E1)
    </text>
  </g>

  <!-- Caja 2: Wallet & Payment Service (E2) -->
  <g transform="translate(230, 480)">
    <rect x="0" y="0" width="150" height="85" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#card-shadow)"/>
    <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Wallet &amp; ACID
    </text>
    <text x="75" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Payment (E2)
    </text>
  </g>

  <!-- Caja 3: Portfolio Asset Service (E2) -->
  <g transform="translate(425, 480)">
    <rect x="0" y="0" width="150" height="85" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#card-shadow)"/>
    <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Portfolio &amp;
    </text>
    <text x="75" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Inventory (E2)
    </text>
  </g>

  <!-- Caja 4: Ledger & Audit Service (PostgreSQL) -->
  <g transform="translate(620, 480)">
    <rect x="0" y="0" width="150" height="85" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#card-shadow)"/>
    <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Order Ledger
    </text>
    <text x="75" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      &amp; Audit
    </text>
  </g>

  <!-- Caja 5: Notification Service (E3) -->
  <g transform="translate(810, 480)">
    <rect x="0" y="0" width="150" height="85" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#card-shadow)"/>
    <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Notification
    </text>
    <text x="75" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      Worker (E3)
    </text>
  </g>

  <!-- Nota de pie de página institucional -->
  <text x="500" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
    Patrón Saga Orchestrator implementado en CryptoPulse • Resiliencia ISO 9126 y Transaccionalidad ACID
  </text>
</svg>
