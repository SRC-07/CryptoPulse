version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cryptopulse-frontend
    ports:
      - "3000:80"
    networks:
      - cryptopulse-public
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: cryptopulse-gateway
    ports:
      - "8080:80"
    networks:
      cryptopulse-public:
        aliases:
          - gateway
      cryptopulse-internal:
        aliases:
          - gateway
    depends_on:
      market-service:
        condition: service_healthy
    restart: unless-stopped

  market-service:
    build:
      context: ./services/market-service
      dockerfile: Dockerfile
    container_name: cryptopulse-market-service
    env_file:
      - .env
    networks:
      cryptopulse-internal:
        aliases:
          - market-service
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cryptopulse-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      cryptopulse-internal:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptopulse -d cryptopulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  cryptopulse-public:
    driver: bridge
  cryptopulse-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
